name: Android Build

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Prebuild Android
        run: npx expo prebuild --platform android

      - name: Disable New Architecture
        run: node -e "const f=require('fs');const p='android/gradle.properties';const c=f.readFileSync(p,'utf8');f.writeFileSync(p,c.replace('newArchEnabled=true','newArchEnabled=false'))"

      - name: Verify newArchEnabled is false
        run: grep newArchEnabled android/gradle.properties

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: essay-reader-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
