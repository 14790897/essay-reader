name: Android Build

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Prebuild Android
        run: npx expo prebuild --platform android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: essay-reader-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  smoke-test:
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: essay-reader-apk

      - name: Install and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: |
            adb logcat -c
            adb install app-debug.apk
            adb shell am start -n com.essayreader.app/.MainActivity
            sleep 15
            FOREGROUND="$(adb shell dumpsys activity activities | grep mResumedActivity)"
            echo "Foreground: $FOREGROUND"
            if ! echo "$FOREGROUND" | grep -q "com.essayreader"; then echo "=== APP NOT IN FOREGROUND ==="; echo "=== Logcat ==="; adb logcat -d | grep -E "(AndroidRuntime|ReactNative|FATAL|crash)" | tail -60; fi
            adb logcat -d > logcat.txt
            adb shell screencap -p /sdcard/screenshot.png
            adb pull /sdcard/screenshot.png .

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshot
          path: screenshot.png
          retention-days: 7

      - name: Upload logcat
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logcat
          path: logcat.txt
          retention-days: 7

  instrumented-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Prebuild Android
        run: npx expo prebuild --platform android

      - name: Setup instrumented tests
        run: |
          mkdir -p android/app/src/androidTest/java/com/essayreader/app
          cp e2e/android/BasicTest.kt android/app/src/androidTest/java/com/essayreader/app/
          python3 -c "
          path = 'android/app/build.gradle'
          with open(path) as f:
              lines = f.readlines()
          out = []
          in_deps = False
          dep_count = 0
          for line in lines:
              out.append(line)
              if 'versionName' in line and '1.0.0' in line:
                  out.append('        testInstrumentationRunner \"androidx.test.runner.AndroidJUnitRunner\"\n')
              if 'dependencies {' in line:
                  in_deps = True
              if in_deps and line.strip() == '}' and dep_count == 0:
                  dep_count += 1
                  out.append('    androidTestImplementation(\"androidx.test.ext:junit:1.2.1\")\n')
                  out.append('    androidTestImplementation(\"androidx.test:core:1.6.1\")\n')
                  out.append('    androidTestImplementation(\"androidx.test:runner:1.6.2\")\n')
          with open(path, 'w') as f:
              f.writelines(out)
          print('build.gradle configured')
          "

      - name: Enable KVM
        run: |
          echo 'KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          disk-size: 6000M
          heap-size: 600M
          script: cd android && adb wait-for-device && ./gradlew connectedDebugAndroidTest --build-cache --daemon

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: android/app/build/reports/androidTests/
