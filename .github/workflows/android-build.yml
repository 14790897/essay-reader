name: Android Build

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Prebuild Android
        run: npx expo prebuild --platform android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: essay-reader-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  firebase-test:
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: essay-reader-apk

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: List available devices
        run: gcloud firebase test android models list --format="table(id, name, brand, form)" 2>&1 | head -30

      - name: Run Firebase Test Lab (Robo)
        run: |
          gcloud firebase test android run \
            --type robo \
            --app app-release.apk \
            --device model=Pixel2.arm,version=30,locale=en,orientation=portrait \
            --timeout 5m
