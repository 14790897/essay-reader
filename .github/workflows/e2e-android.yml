name: E2E Android

on:
  workflow_dispatch:

jobs:
  e2e-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download latest APK from android-build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list -w android-build.yml -R 14790897/essay-reader --limit 1 --json databaseId -q ".[0].databaseId")
          echo "Downloading from run $RUN_ID"
          gh run download $RUN_ID -n essay-reader-apk -R 14790897/essay-reader

      - name: Run E2E on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          disable-spellchecker: true
          script: |
            echo "=== Install APK ===" && adb wait-for-device && adb install app-release.apk && echo "=== Start logcat ===" && adb logcat -c && timeout 15 adb logcat -v time > /tmp/e2e-logcat.txt 2>&1 & echo "=== Launch app ===" && adb shell am start -n com.essayreader.app/.MainActivity -W && echo "=== Wait for render (poll uiautomator) ===" && for i in $(seq 1 15); do sleep 2; adb shell uiautomator dump /sdcard/ui.xml 2>/dev/null; adb pull /sdcard/ui.xml /tmp/e2e-ui-dump.xml 2>/dev/null && (grep -q "Essay Reader" /tmp/e2e-ui-dump.xml || grep -q "System TTS" /tmp/e2e-ui-dump.xml) && echo "PASS: App rendered after ${i}x2s" && break; echo "attempt $i/15"; done && adb shell screencap -p /sdcard/screenshot.png && adb pull /sdcard/screenshot.png /tmp/e2e-screenshot.png && echo "=== Verify ===" && if grep -qs "Essay Reader\|System TTS" /tmp/e2e-ui-dump.xml 2>/dev/null; then echo "E2E PASSED"; else echo "E2E FAILED - app did not render, check artifacts"; tail -30 /tmp/e2e-logcat.txt 2>/dev/null; exit 1; fi

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            /tmp/e2e-screenshot.png
            /tmp/e2e-logcat.txt
            /tmp/e2e-ui-dump.xml
          retention-days: 3
