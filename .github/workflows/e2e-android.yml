name: E2E Android

on:
  workflow_dispatch:

jobs:
  e2e-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download latest APK from android-build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list -w android-build.yml -R 14790897/essay-reader --limit 1 --json databaseId -q ".[0].databaseId")
          echo "Downloading from run $RUN_ID"
          gh run download $RUN_ID -n essay-reader-apk -R 14790897/essay-reader
          ls -la app-release.apk

      - name: Smoke test on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          disable-spellchecker: true
          script: |
            echo "=== Install APK ===" && adb wait-for-device && adb install app-release.apk && echo "=== Start logcat ===" && adb logcat -c && adb logcat -v time > /tmp/e2e-logcat.txt 2>&1 & echo "=== Launch app ===" && adb shell am start -n com.essayreader.app/.MainActivity -W && echo "=== Wait 20s for app to render ===" && sleep 20 && echo "=== Take screenshot ===" && adb shell screencap -p /sdcard/screenshot.png && adb pull /sdcard/screenshot.png /tmp/e2e-screenshot.png && echo "=== Check if app process is running ===" && if adb shell pidof com.essayreader.app; then echo "PASS: app process running"; else echo "FAIL: app process not found"; exit 1; fi

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            /tmp/e2e-screenshot.png
            /tmp/e2e-logcat.txt
          retention-days: 3
