name: E2E Android

on:
  workflow_dispatch:

jobs:
  apk-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download latest APK from android-build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list -w android-build.yml -R 14790897/essay-reader --limit 1 --json databaseId -q ".[0].databaseId")
          echo "Downloading from run $RUN_ID"
          gh run download $RUN_ID -n essay-reader-apk -R 14790897/essay-reader

      - name: Verify APK validity
        run: |
          echo "=== File size ===" && ls -lh app-release.apk
          SIZE=$(stat -c%s app-release.apk)
          if [ "$SIZE" -lt 10000000 ]; then echo "FAIL: APK too small"; exit 1; fi
          echo "=== Valid ZIP ===" && unzip -t app-release.apk > /dev/null && echo "PASS" || (echo "FAIL"; exit 1)
          echo "=== Has AndroidManifest ===" && unzip -l app-release.apk | grep -q "AndroidManifest.xml" && echo "PASS" || (echo "FAIL"; exit 1)

  e2e-emulator:
    needs: apk-verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Download latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list -w android-build.yml -R 14790897/essay-reader --limit 1 --json databaseId -q ".[0].databaseId")
          gh run download $RUN_ID -n essay-reader-apk -R 14790897/essay-reader

      - name: Run on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_4
          disk-size: 6000M
          heap-size: 600M
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: 600
          script: |
            echo "=== Install ===" && adb wait-for-device && adb install app-release.apk && echo "=== Launch ===" && adb shell am start -n com.essayreader.app/.MainActivity -W && echo "=== Wait 20s ===" && sleep 20 && echo "=== Verify ===" && if adb shell pidof com.essayreader.app; then echo "PASS: app running"; adb shell screencap -p /sdcard/screenshot.png && adb pull /sdcard/screenshot.png /tmp/e2e-screenshot.png; else echo "FAIL: app not running"; adb logcat -d | tail -50; exit 1; fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            /tmp/e2e-screenshot.png
          retention-days: 3
